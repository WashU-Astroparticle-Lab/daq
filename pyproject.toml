[tool]
[tool.poetry]
name = "daq"
version = "0.0.0"
description = "Stable wrappers for data acquisition system based on Intermodulation Product Presto-8, used at WashU Astroparticle Lab."
readme = "README.md"
authors = [
  "Lanqing Yuan"
]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Programming Language :: Python",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
repository = "https://github.com/WashU-Astroparticle-Lab/daq"

[tool.poetry.dependencies]
python = ">=3.11"
numpy = "*"
pymongo = "*"
scipy = "*"
# Only needed to talk to VISA benchtop instruments (daq.instruments); the analysis-side
# installs have no VISA runtime, so daq.instruments imports it lazily.
pyvisa = {version = "*", optional = true}
# Resonator circle fitting (daq.analysis.resonator, used by Sweep/SweepPower and
# plot_iq_comparison). Imported lazily so DAQ runs without it; fits are skipped when
# absent. Use the UPSTREAM package -- the WashU fork is no longer required, since
# daq.analysis.resonator recovers the environmental term via the public
# do_calibration() API.
resonator_tools = {version = ">=2.1.0", optional = true}
# Parity reconstruction (daq.analysis.parity, used by TimeStream's constant-bias and
# sawtooth reconstructions): recovers when the parity flipped from an I/Q trace, and
# clusters the flip train into quasiparticle bursts. **daq owns no parity algorithm** --
# qpd owns the method, daq hands it the acquisition -- so this is a requirement rather than
# an extra. Not on PyPI; installed from the lab's repository. It is still imported lazily,
# so an environment that predates this pin degrades to "reconstruction unavailable" instead
# of breaking `import daq`.
qpd = {git = "https://github.com/WashU-Astroparticle-Lab/qpd.git", branch = "main"}

[tool.poetry.extras]
instruments = ["pyvisa"]
analysis = ["resonator_tools"]

[build-system]
requires = ["poetry-core>=1.0.8", "setuptools>=61.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
preview = true

[tool.docformatter]
recursive = true
in-place = true
style = "sphinx"
wrap-summaries = 100
wrap-descriptions = 100
blank = true
